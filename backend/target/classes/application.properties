# Puerto del Servidor
server.port=8080

# Configuración de Base de Datos (PostgreSQL / Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-1-us-west-2.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?currentSchema=public&sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres.azgcsnueofbmeterjlqi}
spring.datasource.password=${DB_PASSWORD:Zercopadill@17}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Deshabilitar prepared statements del servidor (requerido para Supabase transaction pooler)
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# Propiedades JWT (Configuración por defecto)
jwt.secret=9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d
# Tiempo de expiración: 1 día (en milisegundos: 86400000)
jwt.expiration=86400000

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Habilitar documentación Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
